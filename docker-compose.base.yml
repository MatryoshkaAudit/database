services:
  postgres:
    image: postgres:16-alpine
    container_name: matryoshka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matryoshka
      POSTGRES_PASSWORD: matryoshka_pass
      POSTGRES_DB: matryoshka_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matryoshka -d matryoshka_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: matryoshka_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
